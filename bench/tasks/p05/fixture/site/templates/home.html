<!doctype html>
<html><head><title>{{ site.title }}</title><link rel="stylesheet" href="/static/css/site.css"></head>
<body>
{% include "header.html" %}
<ul>
{% for post in posts %}<li><a href="{{ post.url }}">{{ post.title }}</a> ({{ post.date }})</li>
{% endfor %}</ul>
<p>Page {{ pagination.number }} of {{ pagination.total }}
{% if pagination.prev_url %}<a href="{{ pagination.prev_url }}">newer</a>{% endif %}
{% if pagination.next_url %}<a href="{{ pagination.next_url }}">older</a>{% endif %}</p>
</body></html>
